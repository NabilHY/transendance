groups:
  - name: service-availability
    interval: 30s
    rules:
      # Only alert if service is down for extended period (5+ minutes)
      - alert: ServiceDown
        expr: up{job!="prometheus"} == 0
        for: 5m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Service {{ $labels.service }} is down'
          description: 'Service "{{ $labels.service }}" (job: {{ $labels.job }}, instance: {{ $labels.instance }}) has been down for more than 5 minutes.'

  - name: http-performance
    interval: 30s
    rules:
      # Only alert on very high server error rates (10%+ for 10 minutes)
      - alert: HighServerErrorRate
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])) by (service)
            /
            sum(rate(http_request_duration_seconds_count[5m])) by (service)
          ) > 0.10
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'High 5xx error rate for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" has 5xx error rate of {{ $value }} (threshold: 0.10 = 10%) for 10+ minutes'

      # Only alert on extremely high latency (5s+ p99 for 10 minutes)
      - alert: CriticalRequestLatency
        expr: |
          histogram_quantile(0.99, 
            sum(rate(http_request_duration_seconds_bucket{service!=""}[5m])) by (service, le)
          ) > 5
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Critical latency for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" has 99th percentile latency of {{ printf "%.2f" $value }}s (threshold: 5s) for 10+ minutes'

  - name: database-performance
    interval: 30s
    rules:
      # Only alert on very high database error rates (5%+ for 10 minutes)
      - alert: HighDatabaseErrorRate
        expr: |
          sum(rate(db_query_errors_total[5m])) by (service) 
          / 
          sum(rate(db_queries_total[5m])) by (service) 
          > 0.05
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'High database error rate for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" has database error rate of {{ $value }} (threshold: 0.05 = 5%) for 10+ minutes'

      # Only alert on very slow database queries (2s+ p99 for 10 minutes)
      - alert: VerySlowDatabaseQueries
        expr: |
          histogram_quantile(0.99, 
            sum(rate(db_query_duration_seconds_bucket[5m])) by (service, le)
          ) > 2
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Very slow database queries for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" has p99 database query duration of {{ printf "%.2f" $value }}s (threshold: 2s) for 10+ minutes'

      # Only alert on database saturation (200+ queries for 10 minutes)
      - alert: DatabaseQuerySaturation
        expr: |
          max(db_queries_in_flight) by (service) > 200
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Database query saturation for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" has {{ printf "%.0f" $value }} in-flight database queries (threshold: 200) for 10+ minutes. Database may be overwhelmed.'

  - name: resource-usage
    interval: 30s
    rules:
      # Only alert on critical memory usage (95%+ for 10 minutes)
      - alert: CriticalMemoryUsage
        expr: |
          (process_resident_memory_bytes{service!=""} 
          / 
          on(instance) node_memory_MemTotal_bytes) > 0.95
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Critical memory usage for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" is using {{ $value }} of available memory (threshold: 0.95 = 95%) for 10+ minutes. Service may crash soon.'

      # Only alert on critical CPU usage (98%+ for 10 minutes)
      - alert: CriticalCPUUsage
        expr: |
          rate(process_cpu_user_seconds_total{service!=""}[5m]) 
          + 
          rate(process_cpu_system_seconds_total{service!=""}[5m]) 
          > 0.98
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Critical CPU usage for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" is using {{ $value }} CPU (threshold: 0.98 = 98%) for 10+ minutes. Performance degradation likely.'

      # Only alert on critical heap memory (95%+ for 10 minutes)
      - alert: CriticalHeapMemoryUsage
        expr: |
          (nodejs_heap_size_used_bytes{service!=""} 
          / 
          nodejs_heap_size_total_bytes{service!=""}) > 0.95
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Critical heap memory usage for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" heap is {{ $value }} full (threshold: 0.95 = 95%) for 10+ minutes. GC pressure very high, service may crash.'

  - name: application-health
    interval: 30s
    rules:
      # Only alert on severe request backlog (500+ requests for 10 minutes)
      - alert: RequestBacklog
        expr: |
          max(http_requests_in_flight) by (service) > 500
        for: 10m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
        annotations:
          summary: 'Severe request backlog for service {{ $labels.service }}'
          description: 'Service "{{ $labels.service }}" has {{ printf "%.0f" $value }} in-flight HTTP requests (threshold: 500) for 10+ minutes. Service is severely overwhelmed.'

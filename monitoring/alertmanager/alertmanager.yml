global:
  resolve_timeout: 5m

route:
  receiver: default-email
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: default-email
    email_configs:
      - to: 'dev-alerts@example.test'
        from: 'alertmanager@example.test'
        smarthost: 'mailpit:1025'
        require_tls: false
        send_resolved: true
        headers:
          Subject: 'Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h2>{{ .CommonAnnotations.summary }}</h2>
          <p>{{ .CommonAnnotations.description }}</p>
          {{ if .CommonLabels.service }}
          <p><strong>Service:</strong> {{ .CommonLabels.service }}</p>
          {{ end }}
          {{ if .CommonLabels.severity }}
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          {{ end }}
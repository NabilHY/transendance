events {
    worker_connections 1024;
}

http {
    # Increase buffer sizes to handle large headers (cookies, etc.)
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    # Enable detailed error logging
    error_log /var/log/nginx/error.log info;
    
    upstream frontend {
        server frontend:3010;
    }

    upstream auth-backend {
        server auth-backend:8005;
    }

    upstream usr-manag {
        server usr-manag:4000;
    }

    upstream chat {
        server chat:8006;
    }

    upstream game-backend {
        server game-backend:4322;
    }

    upstream mailpit {
        server mailpit:8025;
    }
    
    upstream minio {
        server minio:9000;
    }
    
    upstream minio-console {
        server minio:9002;
    }
    
    server {
          listen 80 default_server;
          server_name _;
        #   return 301 https://$host$request_uri;

          location /api/auth/   { proxy_pass http://auth-backend; }
          location /api/users/  { proxy_pass http://usr-manag/; }
          location /notifications/ws { proxy_pass http://usr-manag/notifications/ws; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
          location /api/chat/ws { proxy_pass http://chat/ws; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
          location /api/game/ws { proxy_pass http://game-backend/ws; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
          location /api/game/   { rewrite ^/api/game/(.*)$ /$1 break; proxy_pass http://game-backend; }
          location = /api/csrf-token  { proxy_pass http://auth-backend/api/csrf-token; }
          location = /api/game-token  { proxy_pass http://auth-backend/api/game-token; }
          location /email { proxy_pass http://mailpit/email; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
          location / { proxy_pass http://frontend; }
          location /api/media/ {
            # Strip /api/media/ prefix and pass to MinIO
            rewrite ^/api/media/(.*)$ /$1 break;
            proxy_pass http://minio;
            proxy_http_version 1.1;
            # Set Host to MinIO's internal hostname (presigned URLs are signed with this)
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Preserve query string for presigned URLs
            proxy_pass_request_headers on;
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # Use certificate for local IP 10.32.110.187
        ssl_certificate /etc/nginx/certs/10.32.110.187.crt;
        ssl_certificate_key /etc/nginx/certs/10.32.110.187.key;

        # SSL configuration (security best practices)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Auth Backend API
        location /api/auth/ {
            proxy_pass http://auth-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # User Management API
        location /api/users/ {
            proxy_pass http://usr-manag/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Chat WebSocket
        location /api/chat/ws {
            proxy_pass http://chat/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Game Backend WebSocket
        location /api/game/ws {
            proxy_pass http://game-backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Game Backend HTTP API (stats, etc.)
        location /api/game/ {
            # Strip /api/game/ prefix and pass through to the game-backend root
            # Example: /api/game/api/player-stats -> /api/player-stats
            rewrite ^/api/game/(.*)$ /$1 break;
            proxy_pass http://game-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # CSRF Token route (specific location before catch-all)
        location = /api/csrf-token {
            proxy_pass http://auth-backend/api/csrf-token;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Game Token route
        location = /api/game-token {
            proxy_pass http://auth-backend/api/game-token;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Mailpit Email UI - with MP_WEBROOT=/email, Mailpit expects requests at /email
        location /email {
            # Proxy to mailpit, preserving the /email path
            proxy_pass http://mailpit/email;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            # WebSocket support for Mailpit real-time updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # MinIO Media Storage (avatars, etc.)
        location /api/media/ {
            # Strip /api/media/ prefix and pass to MinIO
            rewrite ^/api/media/(.*)$ /$1 break;
            proxy_pass http://minio;
            proxy_http_version 1.1;
            # Set Host to MinIO's internal hostname (presigned URLs are signed with this)
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Preserve query string for presigned URLs
            proxy_pass_request_headers on;
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # Frontend - serve the Next.js app
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Important: Set X-Forwarded-Proto to https so the app knows it's behind HTTPS
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
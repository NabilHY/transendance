services:
  auth-backend:
    build: ./auth-backend
    command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${AUTH_PORT:-8005}:${AUTH_PORT:-8005}
    env_file: .env
    networks:
      - ft_transendance
    volumes:
      - users_data:/usr/src/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${AUTH_PORT:-8005}/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  frontend:
    build: ./frontend
    command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${FRONTEND_PORT:-8080}:${FRONTEND_PORT:-8080}
    networks:
      - ft_transendance
    depends_on: 
      auth-backend:
        condition: service_healthy
      usr-manag:
        condition: service_healthy
    env_file: .env
    # volumes:
    #   - /app/.next

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"  # SMTP server port
      - "8025:8025"  # Web UI port
    networks:
      - ft_transendance
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

  usr-manag:
    build: ./usr-manag
    command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${USR_MANAG_PORT:-4000}:${USR_MANAG_PORT:-4000}
    networks:
      - ft_transendance
    depends_on:
      auth-backend:
        condition: service_healthy
    volumes:
      - users_data:/usr/src/app/db
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${USR_MANAG_PORT:-4000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ft_transendance:
    driver: bridge

volumes:
  users_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/transendance_volumes/users_db

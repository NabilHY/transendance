services:
  db-init:
    build: ./db-init
    # command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${DB_INIT_PORT:-3005}:${DB_INIT_PORT:-3005}
    env_file: .env
    networks:
      - ft_transendance
    volumes:
      - users_data:/usr/src/app/db
      - ./db-init:/usr/src/app
      - db_init_node_modules:/usr/src/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${DB_INIT_PORT:-3005}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-backend:
    build: ./auth-backend
    # command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${AUTH_PORT:-8005}:${AUTH_PORT:-8005}
    env_file: .env
    networks:
      - ft_transendance
    volumes:
      - ./auth-backend:/usr/src/app
      - auth_backend_node_modules:/usr/src/app/node_modules
      - users_data:/usr/src/app/db
    depends_on:
      db-init:
        condition: service_healthy
    healthcheck:
      # test: ["CMD", "curl", "-fsS", "http://localhost:8005/health"]
      test: ["CMD", "curl", "-fsS", "http://localhost:${AUTH_PORT:-8005}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      # disable: true

  frontend:
    container_name: frontend
    build: ./frontend
    # command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${FRONTEND_PORT:-3010}:${FRONTEND_PORT:-3010}
    networks:
      - ft_transendance
    depends_on:
      auth-backend:
        condition: service_healthy
      usr-manag:
        condition: service_healthy
    env_file: .env
    # Default to development mode for hot reload unless explicitly overridden
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ENABLE_HOT_RELOAD=${ENABLE_HOT_RELOAD:-true}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  usr-manag:
    build: ./usr-manag
    # command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${USR_MANAG_PORT:-4000}:${USR_MANAG_PORT:-4000}
    networks:
      - ft_transendance
    depends_on:
      db-init:
        condition: service_healthy
      auth-backend:
        condition: service_healthy
    volumes:
      - ./usr-manag:/usr/src/app
      - usr_manag_node_modules:/usr/src/app/node_modules
      - users_data:/usr/src/app/db
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${USR_MANAG_PORT:-4000}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  game-backend:
    build:
      context: ./game-backend
      dockerfile: Dockerfile
    ports:
      - ${GAME_BACKEND_PORT:-4322}:${GAME_BACKEND_PORT:-4322}
    networks:
      - ft_transendance
    env_file: .env
    working_dir: /usr/src/app
    command: ["node", "server.js"]
    volumes:
      - ./game-backend:/usr/src/app  # Development volume for hot reload
      - /usr/src/app/node_modules    # Prevent node_modules from being overwritten
      - users_data:/usr/src/app/db   # Shared database volume
    depends_on:
      db-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${GAME_BACKEND_PORT:-4322}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9002"
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - ft_transendance
    volumes:
      - minio_data:/data
    expose:
      - "9000" # S3 API internal-only
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000" # S3 API (for browser access to presigned URLs)
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9002}:9002" # Console UI (optional)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  ft_transendance:
    driver: bridge

volumes:
  users_data:
    driver: local

  db_init_node_modules:
    driver: local

  auth_backend_node_modules:
    driver: local

  usr_manag_node_modules:
    driver: local

  chat_node_modules:
    driver: local

  frontend_node_modules:
    driver: local

  grafana_data:
    driver: local

  prometheus_data:
    driver: local
    
  alertmanager_data:
    driver: local
  
  minio_data:
    driver: local

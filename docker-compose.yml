services:
  # Database Initialization Service (runs first)
  db-init:
    build: ./db-init
    command: npm start
    ports:
      - 3000:3000
    networks:
      - ft_transendance
    volumes:
      - shared_db_data:/usr/src/app/db
    environment:
      - DATABASE_PATH=/usr/src/app/db/shared.sqlite
      - DATABASE_DIR=/usr/src/app/db
      - DB_INIT_PORT=3000

  # Auth Backend (depends on db-init)
  auth-backend:
    build: ./auth-backend
    command: npm run dev  
    ports:
      - 8005:8005
    env_file: ./auth-backend/.env
    networks:
      - ft_transendance
    volumes:
      - ./auth-backend:/usr/src/app
      - /usr/src/app/node_modules
      - shared_db_data:/usr/src/app/db
    environment:
      - DB_FILE=/usr/src/app/db/shared.sqlite
    depends_on:
      - db-init
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8005/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 5s
      timeout: 3s
      retries: 24

  # User Management (depends on db-init)
  usr-manag:
    build: ./usr-manag
    command: npm start
    ports:
      - 4000:4000
    networks:
      - ft_transendance
    depends_on:
      - db-init
    volumes:
      - ./usr-manag:/usr/src/app
      - /usr/src/app/node_modules
      - shared_db_data:/usr/src/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-backend:8005
      - DATABASE_PATH=/usr/src/app/data/shared.sqlite
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (depends on auth-backend)
  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - 8080:8080
    networks:
      - ft_transendance
    depends_on:
      auth-backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # Mailpit (email testing)
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"  # SMTP server port
      - "8025:8025"  # Web UI port
    networks:
      - ft_transendance
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

networks:
  ft_transendance:
    driver: bridge

volumes:
  shared_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/trancendance_volumes/shared-db
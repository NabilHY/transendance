  chat:
    build: ./chat
    command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${CHAT_PORT:-8006}:${CHAT_PORT:-8006}
    networks:
      - ft_transendance
    depends_on:
      db-init:
        condition: service_healthy
      auth-backend:
        condition: service_healthy
    volumes:
      - ./chat:/usr/src/app
      - chat_node_modules:/usr/src/app/node_modules
      - users_data:/usr/src/app/db

services:

  # -------------------------  Database Initialiser  ------------------------- #
  db-init:
    build:
      context: ./db-init
      dockerfile: Dockerfile
    image: transendance/db-init:latest
    env_file: .env.prod
    networks:
      - ft_transendance
    volumes:
      - ./db-init:/usr/src/app
      - /usr/src/app/node_modules
      - users_data:/usr/src/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${DB_INIT_PORT:-3005}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ------------------------------  Auth API  ------------------------------- #
  auth-backend:
    build:
      context: ./auth-backend
      dockerfile: Dockerfile
    image: transendance/auth-backend:latest
    env_file: .env.prod
    depends_on:
      db-init:
        condition: service_healthy
    networks:
      - ft_transendance
    ports:
      - "${AUTH_PORT:-8005}:${AUTH_PORT:-8005}"
    volumes:
        - ./auth-backend:/usr/src/app
        - /usr/src/app/node_modules
        - users_data:/usr/src/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${AUTH_PORT:-8005}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------  Users Service  ----------------------------- #
  usr-manag:
    build:
      context: ./usr-manag
      dockerfile: Dockerfile
    image: transendance/usr-manag:latest
    env_file: .env.prod
    depends_on:
      db-init:
        condition: service_healthy
      auth-backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ft_transendance
    ports:
      - "${USR_MANAG_PORT:-4000}:${USR_MANAG_PORT:-4000}"
    volumes:
    - ./usr-manag:/usr/src/app
    - /usr/src/app/node_modules
    - users_data:/usr/src/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${USR_MANAG_PORT:-4000}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # -----------------------------  Chat API  -------------------------------- #
  chat:
    build:
      context: ./chat
      dockerfile: Dockerfile
    image: transendance/chat:latest
    env_file: .env.prod
    depends_on:
      db-init:
        condition: service_healthy
      auth-backend:
        condition: service_healthy
    networks:
      - ft_transendance
    ports:
      - "${CHAT_PORT:-8006}:${CHAT_PORT:-8006}"
    volumes:
      - users_data:/usr/src/app/db
      - ./chat:/usr/src/app
      - /usr/src/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${CHAT_PORT:-8006}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------  Game Backend  ------------------------------ #
  game-backend:
    build:
      context: ./game-backend
      dockerfile: Dockerfile
    image: transendance/game-backend:latest
    env_file: .env.prod
    depends_on:
      db-init:
        condition: service_healthy
    networks:
      - ft_transendance
    ports:
      - "${GAME_BACKEND_PORT:-4322}:${GAME_BACKEND_PORT:-4322}"
    volumes:
      - ./game-backend:/usr/src/app
      - /usr/src/app/node_modules
      - users_data:/usr/src/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${GAME_BACKEND_PORT:-4322}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------  Front-end SPA  ----------------------------- #
  frontend:
    container_name: frontend
    build: ./frontend
    # command: sh -lc "chmod +x ./docker/run.sh && ./docker/run.sh"
    ports:
      - ${FRONTEND_PORT:-3010}:${FRONTEND_PORT:-3010}
    networks:
      - ft_transendance
    depends_on:
      auth-backend:
        condition: service_healthy
      usr-manag:
        condition: service_healthy
    env_file: .env.prod

  # -----------------------------  Mailpit  --------------------------------- #
  # Keep Mailpit accessible only from the internal network in production.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    env_file: .env.prod
    environment:
      # Set webroot to match nginx subpath - Mailpit will generate URLs with /email prefix
      MP_WEBROOT: /email
    networks:
      - ft_transendance
    restart: unless-stopped
    expose:
      - "1025"  # SMTP port
      - "8025"  # Web UI port
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------  NGINX Gateway  ----------------------------- #
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: transendance/nginx:latest
    depends_on:
      frontend:
        condition: service_started
      auth-backend:
        condition: service_started
      game-backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ft_transendance
    env_file: .env.prod
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
       - ./nginx/certs:/etc/nginx/certs:ro
       
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx:8080/nginx_status'
    ports:
      - "9113:9113"
    networks:
      - ft_transendance
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-4010}:${GRAFANA_PORT:-4010}"
    networks:
      - ft_transendance
    environment:
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-4010}
      # Security: Disable default admin/admin creation
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
      # Security: Disable anonymous access (explicit)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Security Headers: HSTS
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS=31536000
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY_PRELOAD=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY_SUBDOMAINS=true
      # Security Headers: Content Security Policy
      - GF_SECURITY_CONTENT_SECURITY_POLICY=true
      # Additional security settings
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
    depends_on:
      prometheus:
        condition: service_started
    env_file: .env.prod
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    networks:
      - ft_transendance
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9100/metrics >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
        
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - ft_transendance
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    env_file: .env
    depends_on:
      node-exporter:
        condition: service_healthy
  
          
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - ft_transendance
    ports:
      - ${ALERTMANAGER_PORT:-9093}:9093
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./monitoring/alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file: .env
    environment:
      - SENDGRID_API_KEY=${SENDGRID_SMTP_PASS:-}
      
  prometheus:
    build: ./monitoring/prometheus
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    networks:
      - ft_transendance
    depends_on:
      auth-backend:
        condition: service_healthy
      usr-manag:
        condition: service_healthy
      chat:
        condition: service_started
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    develop:
      watch:
        - path: ./monitoring/prometheus
          action: restart
    env_file: .env
    
  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      nginx:
        condition: service_started
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-36qHZyVLbGbty71Ix6Ox3hDOrBm_4sYrNZbnbnxbqCgKdTwxE}
    command: ["http", "nginx:80"]
    networks:
      - ft_transendance
    env_file: .env.prod
    
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9002"
    env_file: .env.prod
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    networks:
      - ft_transendance
    volumes:
      - minio_data:/data
    expose:
      - "9000" # S3 API internal-only
    ports:
      - "${MINIO_PORT:-9000}:9000" # S3 API (for browser access to presigned URLs)
      - "${MINIO_CONSOLE_PORT:-9002}:9002" # Console UI (optional)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# ---------------------------------------------------------------------------
#  Networks & Volumes
# ---------------------------------------------------------------------------

networks:
  ft_transendance:
    driver: bridge

volumes:
  users_data:
    driver: local
  nginx_certs:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  minio_data:
    driver: local